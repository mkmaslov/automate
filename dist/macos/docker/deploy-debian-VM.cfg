# Unattended Debian installation
# UEFI VM with a single virtual disk

# Locale, language and timezone settings
d-i debian-installer/language string en
d-i debian-installer/country string DE
d-i debian-installer/locale string en_IE.UTF-8
#d-i localechooser/supported-locales multiselect en_IE.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

# Hostnames
d-i netcfg/choose_interface select auto
# EDIT: set VM's hostname
d-i netcfg/get_hostname string HOSTNAME
d-i netcfg/hostname string HOSTNAME
d-i netcfg/get_domain string local

# Package manager settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

# Users and passwords
# Generate password hash with: openssl passwd -6
d-i passwd/root-login boolean true
# EDIT: insert root password hash
d-i passwd/root-password-crypted password REPLACE_WITH_ROOT_PASSWORD_HASH
d-i passwd/make-user boolean true
# EDIT: insert non-root user name and password hash
d-i passwd/user-fullname string USERNAME
d-i passwd/username string USERNAME
d-i passwd/user-password-crypted password REPLACE_WITH_USER_PASSWORD_HASH
d-i passwd/user-default-groups string users

# Partition disks
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
#d-i partman-lvm/device_remove_lvm boolean true
#d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
#d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean true
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string locales
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Install GRUB automatically when Debian is the only operating system.
d-i grub-installer/only_debian boolean true

# Use the default disk as the bootloader installation target.
d-i grub-installer/bootdev string default

# Eject the installer CD before rebooting.
d-i cdrom-detect/eject boolean true

# Skip the final "installation complete" confirmation and reboot.
d-i finish-install/reboot_in_progress note

#d-i grub-installer/with_other_os boolean true

# Power off after installation so the ISO can be detached.
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean true

# Run provision script
# EDIT: insert public SSH key
d-i preseed/late_command string \
    VM_USER="$(debconf-get passwd/username)" && \
    SSH_PUBLIC_KEY='ssh-ed25519 REPLACE_WITH_PUBLIC_KEY_DATA' && \
    cp /cdrom/provision.sh /target/root/provision.sh && \
    in-target /bin/bash /root/provision.sh "$VM_USER" "$SSH_PUBLIC_KEY"
